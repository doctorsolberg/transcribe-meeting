[project]
name = "transcribe-meeting"
version = "1.0.0"
description = "Local, resumable meeting transcription (MPS on Apple Silicon, CPU elsewhere)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Igor Zilberg", email = "doctorsolberg@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<14",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "openai>=1.0,<2",
  "gigaam @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
  "pyannote.audio>=3.3",
  "torch>=2.3",
  "huggingface-hub>=0.24,<1",
  "numpy>=1.26",
  # Not imported by our code directly; pyannote.audio's audio backend needs it at runtime.
  "soundfile>=0.12,<1",
  "diarize>=0.1.2,<0.2",
]

[project.urls]
Homepage = "https://github.com/doctorsolberg/transcribe-meeting"
Repository = "https://github.com/doctorsolberg/transcribe-meeting"
Issues = "https://github.com/doctorsolberg/transcribe-meeting/issues"

[project.scripts]
transcribe-meeting = "transcribe_meeting.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transcribe_meeting"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[tool.uv]
# Supported installation is from source with `uv sync --locked`. This override
# is not part of wheel metadata; building a wheel does not verify pip resolution.
# diarize pins torch<2.9 and torchaudio<2.9, while pyannote.audio 4 and GigaAM need a
# current torch. The API diarize actually uses (torchaudio.load,
# torchaudio.compliance.kaldi) is present in the 2.11/2.13 branch already installed.
override-dependencies = ["torch>=2.3", "torchaudio>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["requires_ffmpeg: needs a real ffmpeg binary on PATH"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003 flag Cyrillic letters as "ambiguous" look-alikes of Latin
# ones (а/a, е/e, ...). Russian text survives where it is functionally required —
# the fusion prompt, the ASR hint, the filler lists it matches against, and the
# Russian speech samples in the tests — so those strings would all trip this rule.
# It guards against homoglyph confusion in an otherwise-Latin codebase; here the
# Cyrillic is deliberate and load-bearing.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The fusion prompt text is verbatim (see the comment above it in readable.py) and
# must not be reflowed to satisfy line length - that would change what is sent to
# the model.
"transcribe_meeting/readable.py" = ["E501"]
