name: CI

# No provider calls or model downloads: tests use fixtures, bundled Silero VAD,
# and generated audio. FFmpeg and ONNX Runtime are exercised with local inputs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python }} --group dev

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      # 75% is today's measured coverage floor (see CONTRIBUTING.md); a regression
      # below it fails CI instead of only showing up as a smaller number in the log.
      - name: Coverage report
        run: uv run --no-sync pytest -q --cov=transcribe_meeting --cov-report=term-missing --cov-fail-under=75

      - name: Build package
        run: uv build --python ${{ matrix.python }}

      - name: Verify unpacked sdist and run offline integration tests
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          unpacked="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/tm-sdist.XXXXXX")"
          tar -xzf dist/*.tar.gz -C "$unpacked"
          cd "$unpacked"/transcribe_meeting-*
          for file in .env.example CHANGELOG.md CONTRIBUTING.md uv.lock docs/benchmarks.md \
              scripts/compare_routes.py scripts/model_agreement.py tests/conftest.py \
              tests/fixtures/deepgram_response.json tests/fixtures/gigaam_words.json \
              tests/fixtures/groq_words.json; do
            test -f "$file"
          done
          test -z "$(find . \( -name '.hermes' -o -name '.env' -o -name '.env.*' \) ! -name '.env.example' -print)"
          uv sync --locked --offline --python ${{ matrix.python }} --group dev
          uv run --no-sync transcribe-meeting --help
          uv run --no-sync pytest -q tests/test_provider_fixtures.py tests/test_end_to_end_pipeline.py \
            tests/test_setup_offline.py \
            tests/test_provisioning.py::test_network_asr_setup_smokes_real_foxnose_runtime_offline
          uv run --no-sync pytest -q -m requires_ffmpeg tests/test_audio_preprocess.py

      - name: doctor smoke check (no models on a fresh CI checkout)
        run: |
          empty="$(mktemp -d)"
          status=0
          uv run --no-sync transcribe-meeting --data-root "$empty" doctor > "$empty/doctor.json" || status=$?
          test "$status" -eq 1
          uv run --no-sync python -c 'import json, sys; assert json.load(sys.stdin)["route_ready"] is False' < "$empty/doctor.json"
